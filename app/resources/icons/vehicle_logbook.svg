<svg xmlns="http://www.w3.org/2000/svg"
     width="64"
     height="64"
     viewBox="0 0 64 64">

    <!-- Logbook -->
    <rect
        x="10"
        y="8"
        width="28"
        height="46"
        rx="3"
        fill="none"
        stroke="#000000"
        stroke-width="3"/>

    <!-- Logbook lines -->
    <line x1="16" y1="18" x2="32" y2="18"
          stroke="#000000" stroke-width="2"/>

    <line x1="16" y1="25" x2="30" y2="25"
          stroke="#000000" stroke-width="2"/>

    <line x1="16" y1="32" x2="29" y2="32"
          stroke="#000000" stroke-width="2"/>

    <!-- Vehicle -->
    <path
        d="M31 38
           L35 29
           L51 29
           L56 38
           L58 38
           L58 47
           L54 47
           A5 5 0 0 1 44 47
           L39 47
           A5 5 0 0 1 29 47
           L27 47
           L27 38
           Z"
        fill="none"
        stroke="#000000"
        stroke-width="3"
        stroke-linejoin="round"/>

    <!-- Wheels -->
    <circle cx="34" cy="47" r="3"
            fill="#000000"/>

    <circle cx="49" cy="47" r="3"
            fill="#000000"/>

    <!-- Windscreen -->
    <path
        d="M36 37 L39 32 L48 32 L52 37 Z"
        fill="none"
        stroke="#000000"
        stroke-width="2"/>

</svg>