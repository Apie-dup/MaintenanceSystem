<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <style>
    :root {
      --bg: #f5f7fb;
      --fg: #ffffff;
      --accent: #2f80ed;
      --wheel: #3b4a6b;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1e1f22;
        --fg: #2a2c30;
        --accent: #4ea3ff;
        --wheel: #d0d4db;
      }
    }
  </style>

  <rect x="4" y="4" width="56" height="56" rx="8" fill="var(--bg)" />

  <rect x="10" y="10" width="26" height="44" rx="3"
        fill="var(--fg)" stroke="currentColor" stroke-width="1.5"/>

  <line x1="14" y1="18" x2="32" y2="18" stroke="currentColor" stroke-width="1.2"/>
  <line x1="14" y1="24" x2="30" y2="24" stroke="currentColor" stroke-width="1.2"/>
  <line x1="14" y1="30" x2="28" y2="30" stroke="currentColor" stroke-width="1.2"/>
  <line x1="14" y1="36" x2="30" y2="36" stroke="currentColor" stroke-width="1.2"/>
  <line x1="14" y1="42" x2="26" y2="42" stroke="currentColor" stroke-width="1.2"/>

  <g transform="translate(28,26)">
    <rect x="6" y="8" width="22" height="8" rx="2" fill="var(--accent)"/>
    <path d="M8 8 L12 2 H22 L26 8 Z" fill="var(--accent)"/>
    <rect x="13" y="4" width="6" height="4" rx="1" fill="var(--fg)"/>
    <rect x="20" y="4" width="5" height="4" rx="1" fill="var(--fg)"/>
    <circle cx="11" cy="17" r="3" fill="var(--wheel)"/>
    <circle cx="23" cy="17" r="3" fill="var(--wheel)"/>
    <circle cx="11" cy="17" r="1.4" fill="var(--fg)"/>
    <circle cx="23" cy="17" r="1.4" fill="var(--fg)"/>
  </g>

  <path d="M30 10 L34 10 L34 20 L32 18 L30 20 Z" fill="var(--accent)"/>
</svg>
